<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enquiries | V Learns Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-app">
    <aside class="admin-sidebar">
      <div class="admin-brand"><img src="../assets/image%28165%29.png" alt=""> <span>V Learns Admin</span></div>
      <nav class="admin-menu" data-admin-menu>
        <a href="index.html" data-section="dashboard">Dashboard</a><a href="courses.html" data-section="courses">Courses</a><a href="events.html" data-section="events">Events / Calendar</a><a href="registrations.html" data-section="registrations">Registrations</a><a href="enquiries.html" data-section="enquiries">Enquiries</a><a href="#">Students</a><a href="#">Instructors</a><a href="settings.html">Settings</a><a href="#">Profile</a><a href="../index.html">Logout</a>

        </section>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/events-data.js"></script><script src="../js/supabase-api.js"></script><script src="../js/admin-events.js"></script><script>initAdminEnquiries();</script>
