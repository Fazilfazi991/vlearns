<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registrations | V Learns Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-app">
    <aside class="admin-sidebar">
      <div class="admin-brand"><img src="../assets/image%28165%29.png" alt=""> <span>V Learns Admin</span></div>
      <nav class="admin-menu" data-admin-menu>
        <a href="/admin/index.html" data-section="dashboard">Dashboard</a><a href="/admin/courses.html" data-section="courses">Courses</a><a href="/admin/events.html" data-section="events">Events / Calendar</a><a href="/admin/registrations.html" data-section="registrations">Registrations</a><a href="/admin/enquiries.html" data-section="enquiries">Enquiries</a><a href="/index.html">Public Website</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar"><button class="menu-toggle" type="button" data-sidebar-toggle>=</button><input class="admin-search" placeholder="Search registrations"><div class="admin-profile"><span>Notifications</span><span>Admin</span></div></header>
      <section class="admin-content">
        <div class="page-heading"><div><h1>Registrations</h1><p>Track students/users who registered or enquired for events.</p></div><article class="stat-card"><span>Total Registrations</span><strong data-registration-count>0</strong></article></div>
        <section class="table-card">
          <div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Event</th><th>Course</th><th>Date</th><th>Source</th><th>Status</th><th>Actions</th></tr></thead><tbody data-registrations-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/events-data.js"></script><script src="../js/supabase-api.js"></script><script src="../js/admin-events.js"></script><script>initAdminRegistrations();</script>
